name: Bug report
description: Tethercam does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you. Please do not put personal information (Apple ID, phone number, serial number) in this report.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us what you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Text in the black window
      description: Copy the text from the tethercam window on your PC.
      render: text
  - type: input
    id: phone
    attributes:
      label: Phone model and version
      placeholder: iPhone 13, iOS 18.1  /  Pixel 7, Android 15
    validations:
      required: true
  - type: input
    id: pc
    attributes:
      label: PC system
      placeholder: Windows 11 24H2  /  Ubuntu 24.04
    validations:
      required: true
