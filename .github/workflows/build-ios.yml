name: Build iPhone app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "To publish a release, type its tag (for example v1.2.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project Tethercam.xcodeproj \
            -scheme Tethercam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Tethercam.app Payload/
          zip -qry Tethercam.ipa Payload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tethercam-ipa
          path: ios/Tethercam.ipa

  release:
    # On pull requests this is a dry run: every step runs except publishing.
    if: github.event_name == 'release' || github.event_name == 'pull_request' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach files to the release
      id-token: write      # sign the build provenance
      attestations: write  # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Tethercam-ipa

      - name: Release notes and checksums
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [ -z "$TAG" ]; then  # dry run: use the version in ios/project.yml
            TAG="v$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' ios/project.yml)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          version="${TAG#v}"
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          # Stop if the version is not the same everywhere.
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no section for [$version]"; exit 1; fi
          grep -q "MARKETING_VERSION: \"$version\"" ios/project.yml || { echo "::error::ios/project.yml MARKETING_VERSION is not $version"; exit 1; }
          grep -q "__version__ = \"$version\"" pc/tethercam.py || { echo "::error::pc/tethercam.py __version__ is not $version"; exit 1; }
          # Pin the attached installers to this release, so they install exactly these files.
          sed -i "s#^set \"TETHERCAM_TAG=.*#set \"TETHERCAM_TAG=$TAG\"\r#" Install-Tethercam.bat
          sed -i "s#^set \"TETHERCAM_PS1=.*#set \"TETHERCAM_PS1=https://github.com/${{ github.repository }}/releases/download/$TAG/install.ps1\"\r#" Install-Tethercam.bat
          sed -i "s#^PINNED_TAG=\"\"#PINNED_TAG=\"$TAG\"#" install.sh
          grep -q "TETHERCAM_TAG=$TAG" Install-Tethercam.bat && grep -q "PINNED_TAG=\"$TAG\"" install.sh \
            || { echo "::error::Could not pin the installers to $TAG"; exit 1; }
          cat Install-Tethercam.bat
          sha256sum Tethercam.ipa Install-Tethercam.bat install.ps1 install.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign build provenance (public repos only)
        if: ${{ !github.event.repository.private && github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Tethercam.ipa
            Install-Tethercam.bat
            install.ps1
            install.sh

      - name: Dry run summary
        if: github.event_name == 'pull_request'
        run: echo "Dry run OK for $TAG. Nothing was published."

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ env.TAG }}
          name: tethercam ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            Tethercam.ipa
            Install-Tethercam.bat
            install.ps1
            install.sh
            SHA256SUMS.txt
