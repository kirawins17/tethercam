name: Build iPhone app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "To publish a release, type its tag (for example v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project Tethercam.xcodeproj \
            -scheme Tethercam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Tethercam.app Payload/
          zip -qry Tethercam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Tethercam-ipa
          path: ios/Tethercam.ipa

  release:
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Tethercam-ipa

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          version="${TAG#v}"
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: tethercam ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            Tethercam.ipa
            Install-Tethercam.bat
