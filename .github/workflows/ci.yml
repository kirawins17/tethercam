name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install opencv-python-headless numpy av
      - run: python -m unittest discover -s tests -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check pc tests

  installer-windows:
    name: Windows installer parses (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "install.ps1 OK"
      - name: No download-and-run patterns (antivirus flags them as malware)
        shell: powershell
        run: |
          $bad = Select-String -Path install.ps1, Install-Tethercam.bat -Pattern '\biex\b', 'Invoke-Expression', 'DownloadString', '-Command\s+"?irm', '\.exe''\s*-OutFile' -SimpleMatch:$false
          if ($bad) { $bad | ForEach-Object { Write-Error "$($_.Filename):$($_.LineNumber): $($_.Line)" }; exit 1 }
          Write-Host "No download-and-run patterns found"

  installer-linux:
    name: Linux scripts pass ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -S warning install.sh pc/start-tethercam.sh
